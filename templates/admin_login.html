<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="wrap" style="max-width: 420px;">
    <header class="page-head">
      <p class="kicker">Khu vực quản trị</p>
      <h1>Đăng nhập Admin</h1>
      <p class="lede">Xem lại phản hồi (đánh giá tường minh và hành vi ngầm) từ người dùng hệ thống.</p>
    </header>
    <form class="card" action="/admin" method="post">
      {% if error %}<p style="color:#a33; font-weight:600;">{{ error }}</p>{% endif %}
      <label class="field">
        <span>Mật khẩu quản trị</span>
        <input type="password" name="password" required autofocus>
      </label>
      <button type="submit" class="btn-primary">Đăng nhập</button>
    </form>
  </div>
</body>
</html>
